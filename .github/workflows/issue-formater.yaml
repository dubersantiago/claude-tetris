name: Claude Issue Formatter

on:
  issues:
    types: [opened, edited]

jobs:
  format-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Format issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue:*)"'
          prompt: |
            You are a GitHub issue formatter for a Tetris game project (vanilla JS/HTML/CSS, no dependencies).

            An issue was just ${{ github.event.action }} with the following details:
            - Issue number: #${{ github.event.issue.number }}
            - Title: ${{ github.event.issue.title }}
            - Body: ${{ github.event.issue.body }}
            - Author: ${{ github.event.issue.user.login }}

            Your tasks:
            1. **Add labels** based on the issue content. Use only these labels:
               - `bug` — something is broken or behaving incorrectly
               - `enhancement` — new feature or improvement request
               - `question` — asking for help or clarification
               - `documentation` — docs need updating
               - `good first issue` — simple, beginner-friendly task
               - `duplicate` — if it seems like a known/repeated problem

            2. **Post a comment** on the issue that includes:
               - A brief, friendly summary of what the issue is about (1-2 sentences)
               - A "Formatted Report" section with:
                 - **Type**: Bug / Feature Request / Question / Other
                 - **Summary**: one clear sentence describing the problem or request
                 - **Steps to reproduce** (for bugs): list them if not provided, ask the user to provide them if it's a bug
                 - **Expected behavior** (for bugs): what should happen
                 - **Suggested labels**: the labels you applied and why
               - A closing note thanking the contributor

            The comment must use GitHub Flavored Markdown with eye-catching, attractive styling that GitHub renders natively.
            Write it in the same language as the issue.

            Layout rules (critical):
              - The comment MUST be multi-line. Use real line breaks, never a single line.
              - Put a BLANK LINE between every block: heading, paragraph, table, list, alert, horizontal rule.
              - Every table row goes on its own line, with the header separator row (`|---|---|`) on its own line.
              - Every `---` goes on its own line with a blank line before and after it.
              - Never join headings, tables, rules, or paragraphs with spaces on the same line.

            Visual hierarchy (use different text sizes):
              - ONE `#` title at the top with an emoji, e.g. `# 🐛 Issue Report`
              - `##` for each main section (e.g. `## 📋 Formatted Report`, `## 🔁 Steps to Reproduce`)
              - `###` for subsections if needed
              - Normal text for the short friendly summary, placed right under the title

            Elements to include:
              - Relevant emojis (e.g. 🐛 bug, ✨ feature, ❓ question, 📚 docs)
              - A table for the "Formatted Report" fields (Type, Summary, Expected behavior, Labels)
              - Alert blockquotes `> [!NOTE]`, `> [!TIP]`, `> [!WARNING]` for key remarks or missing info (each on its own lines, starting with `> [!NOTE]` alone on the first line)
              - Numbered lists for steps to reproduce, bold for key terms, inline code for labels and code identifiers
              - A horizontal rule (`---`) before the closing note
            Use only syntax GitHub supports. Do not use raw HTML, CSS, or unsupported extensions.

            Use the `gh` CLI to apply labels and post the comment. Pass the comment through stdin with a quoted heredoc so line breaks are preserved. Do NOT pass multi-line text inside a quoted `--body "..."` string. Example commands:
              gh issue edit ${{ github.event.issue.number }} --add-label "bug" --repo ${{ github.repository }}
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file - <<'EOF'
            # 🐛 Issue Report

            Short friendly summary.

            ## 📋 Formatted Report

            | Field | Detail |
            |---|---|
            | **Type** | ... |

            ---

            Thanks!
            EOF

            Be concise, helpful, and friendly. Do not over-engineer the response.